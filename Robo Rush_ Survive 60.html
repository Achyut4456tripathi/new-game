<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robo Rush: Survive 60</title>
<style>
:root{--bg:#f3f4f8;--fg:#1b1d2a;--card:#fff;--accent:#2f6bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--fg:#eceef6;--card:#1d2030;--accent:#6c9bff}}
:root[data-theme="dark"]{--bg:#12141c;--fg:#eceef6;--card:#1d2030;--accent:#6c9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.3rem;margin:4px 0 10px}
#wrap{position:relative;width:100%;max-width:640px}
canvas{width:100%;display:block;border-radius:12px;background:#0d1020;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(10,12,24,.85);color:#fff;border-radius:12px;padding:16px}
#ov h2{margin:0 0 8px;font-size:1.8rem}
#ov p{margin:4px 0;max-width:440px;line-height:1.45}
button{margin-top:14px;font-size:1.05rem;padding:10px 26px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
small{opacity:.7;margin-top:10px}
</style>
</head>
<body>
<h1>🤖 Robo Rush: Survive 60</h1>
<div id="wrap">
<canvas id="c" width="640" height="480"></canvas>
<div id="ov"></div>
</div>
<small>WASD or arrow keys to move</small>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
const W=640,H=480,NEED=10,TOTAL=60;
let S='menu',best=0,keys={},p,enemies,crystals,boost,t,score,phase,lives,inv,boostT,last=0,msg='';
try{best=+localStorage.getItem('roboRushBest')||0}catch(e){}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const rnd=(a,b)=>a+Math.random()*(b-a);
const inset=()=>phase*28; // arena shrinks each phase
function spot(){const i=inset()+30;return{x:rnd(i,W-i),y:rnd(i,H-i)}}
function addEnemy(){let q;do{q=spot()}while(Math.hypot(q.x-p.x,q.y-p.y)<160);enemies.push({x:q.x,y:q.y})}
function start(){
 S='play';t=0;score=0;phase=0;lives=3;inv=0;boostT=0;boost=null;
 p={x:W/2,y:H/2};enemies=[];crystals=[];
 for(let i=0;i<4;i++)crystals.push(spot());
 for(let i=0;i<3;i++)addEnemy();
 ov.style.display='none';last=performance.now();
}
function end(win,why){
 S=win?'win':'lose';
 let nb='';
 if(win&&score>best){best=score;nb='<p>🏆 New high score!</p>';try{localStorage.setItem('roboRushBest',best)}catch(e){}}
 ov.style.display='flex';
 ov.innerHTML=`<h2>${win?'🎉 You survived!':'💥 Game over'}</h2><p>${why}</p><p>💎 Crystals: ${score} · Best win: ${best}</p>${nb}<button id="b">Play again</button>`;
 document.getElementById('b').onclick=start;
}
function menu(){
 ov.innerHTML=`<h2>🤖 Robo Rush</h2><p>Collect ${NEED}+ 💎 crystals and survive ${TOTAL} seconds while enemy robots chase you.</p><p>⚡ Grab speed boosts. You have 3 lives. Every 15 s the arena gets smaller and nastier.</p><button id="b">Start</button>`;
 document.getElementById('b').onclick=start;
}
function update(dt){
 t+=dt;
 const np=Math.min(3,Math.floor(t/15));
 if(np>phase){phase=np;addEnemy();addEnemy()}
 if(!boost&&Math.random()<dt*0.12)boost=spot();
 const sp=(190+(boostT>0?110:0))*dt;
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const m=Math.hypot(dx,dy)||1;p.x+=dx/m*sp;p.y+=dy/m*sp;
 const i=inset()+12;p.x=Math.max(i,Math.min(W-i,p.x));p.y=Math.max(i,Math.min(H-i,p.y));
 boostT-=dt;inv-=dt;
 crystals.forEach((c,k)=>{if(Math.hypot(c.x-p.x,c.y-p.y)<20){score++;crystals[k]=spot()}});
 // keep crystals inside shrinking arena
 crystals.forEach(c=>{const j=inset()+20;c.x=Math.max(j,Math.min(W-j,c.x));c.y=Math.max(j,Math.min(H-j,c.y))});
 if(boost&&Math.hypot(boost.x-p.x,boost.y-p.y)<20){boost=null;boostT=4}
 const es=(60+phase*22)*dt;
 enemies.forEach(e=>{
  const a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*es;e.y+=Math.sin(a)*es;
  if(inv<=0&&Math.hypot(e.x-p.x,e.y-p.y)<20){lives--;inv=1.2;if(lives<=0)end(false,'The robots caught you.')}
 });
 if(t>=TOTAL){score>=NEED?end(true,`You survived ${TOTAL} seconds with ${score} crystals!`):end(false,`Time is up, but you only got ${score} of ${NEED} crystals.`)}
}
function draw(){
 g.clearRect(0,0,W,H);
 const i=inset();
 g.fillStyle='#3a1020';g.fillRect(0,0,W,H);
 g.fillStyle='#141a33';g.fillRect(i,i,W-2*i,H-2*i);
 g.strokeStyle='#2a3566';g.lineWidth=1;
 for(let x=i;x<=W-i;x+=40){g.beginPath();g.moveTo(x,i);g.lineTo(x,H-i);g.stroke()}
 for(let y=i;y<=H-i;y+=40){g.beginPath();g.moveTo(i,y);g.lineTo(W-i,y);g.stroke()}
 g.font='20px sans-serif';g.textAlign='center';g.textBaseline='middle';
 crystals.forEach(c=>g.fillText('💎',c.x,c.y));
 if(boost)g.fillText('⚡',boost.x,boost.y);
 enemies.forEach(e=>g.fillText('🤖',e.x,e.y));
 if(inv<=0||Math.floor(inv*10)%2){g.fillStyle=boostT>0?'#ffd84a':'#4af0c0';g.beginPath();g.arc(p.x,p.y,13,0,7);g.fill();g.fillStyle='#0d1020';g.fillRect(p.x-7,p.y-4,5,5);g.fillRect(p.x+2,p.y-4,5,5)}
 g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='left';
 g.fillText(`⏱ ${Math.max(0,Math.ceil(TOTAL-t))}s`,12,18);
 g.fillText(`💎 ${score}/${NEED}`,100,18);
 g.fillText('❤️'.repeat(Math.max(0,lives)),190,18);
 g.textAlign='right';g.fillText(`Level ${phase+1}${boostT>0?'  ⚡ BOOST':''}`,W-12,18);
}
function loop(n){
 const dt=Math.min(.05,(n-last)/1000);last=n;
 if(S==='play')update(dt);
 draw();requestAnimationFrame(loop);
}
menu();p={x:W/2,y:H/2};enemies=[];crystals=[];boost=null;phase=0;lives=3;inv=0;boostT=0;t=0;score=0;
requestAnimationFrame(loop);
</script>
</body>
</html>
